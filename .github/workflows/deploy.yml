name: Deploy JobPilot to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.webmanifest"
      - "icon.svg"
      - "service-worker.js"
      - "jobs-feed.json"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/deploy.yml"
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate JobPilot
        run: node tests/smoke.mjs

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Refresh public jobs cache
        run: node scripts/refresh-jobs.mjs
      - name: Commit updated public job cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs-feed.json
          if git diff --cached --quiet; then
            echo "Job cache has not changed."
          else
            git commit -m "Refresh daily public job listings"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
