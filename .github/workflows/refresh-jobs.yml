name: Refresh public jobs cache

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-public-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Refresh public job listings
        run: node scripts/refresh-jobs.mjs
      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs-feed.json
          if git diff --cached --quiet; then
            echo "Job cache has not changed."
          else
            git commit -m "Refresh daily public job listings"
            git push
          fi
