*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,rgba(92,119,210,.15),transparent 40%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.5}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--accent)}.shell{min-height:100vh;display:grid;grid-template-columns:246px minmax(0,1fr)}.side{border-right:1px solid var(--line);background:rgba(12,19,35,.92);padding:25px 15px;display:flex;flex-direction:column;gap:30px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:11px;padding:0 10px}.brandmark{width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,#a9baff,#6684ed);display:grid;place-items:center;color:#101a37;font-weight:900;box-shadow:0 7px 22px #6e8df244}.brandname{font-size:17px;font-weight:760;letter-spacing:-.5px}.brandname small{display:block;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:1.7px;text-transform:uppercase}.navlabel{padding:0 12px;color:#61718e;font-size:10px;letter-spacing:1.7px;text-transform:uppercase;font-weight:800;margin-bottom:9px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#a6b4ca;text-align:left;padding:11px 12px;border-radius:11px;display:flex;align-items:center;gap:12px;font-weight:570;transition:.15s}.nav button:hover{background:#17243a;color:#fff}.nav button.active{background:linear-gradient(90deg,#202f51,#192743);color:#fff;box-shadow:inset 3px 0 var(--accent)}.navicon{width:19px;text-align:center;color:#94a8cf;font-size:16px}.sidefoot{margin-top:auto;border:1px solid var(--line);background:#101a2c;border-radius:13px;padding:13px}.sidefoot strong{display:block;font-size:12px}.sidefoot p{font-size:11px;color:var(--muted);margin:5px 0 0}.workspace{min-width:0}.topbar{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding id;gap:12px}.job{border:1px solid var(--line);background:linear-gradient(135deg,#141f33,#111a2a);border-radius:15px;padding:17px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:15px}.job:hover{border-color:#40577c}.jobtitle{font-size:15px;font-weight:760;letter-spacing:-.2px;margin:0 0 4px}.company{font-size:12px;color:#becbe0}.jobmeta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tag{font-size:10px;border:1px solid #34455f;border-radius:30px;padding:4px 8px;color:#b2c0d6;background:#17243a}.tag.good{color:#8ce0c5;border-color:#285a4f;background:#142c2b}.tag.warn{color:#f1c87d;border-color:#554829;background:#2a2418}.jobdesc{font-size:12px;color:#9eacc2;margin:10px 0 0;max-width:760px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.match{width:65px;height:65px;border-radius:50%;border:4px solid #31496b;display:grid;place-items:center;font-weight:800;font-size:16px;color:#a8e4d2;text-align:center}.match span{font-size:9px;display:block;color:#8e9db4;font-weight:600;margin-top:-20px}.jobactions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.jobright{display:flex;flex-direction:column;align-items:center;gap:8px}.empty{border:1px dashed #3a4d69;border-radius:16px;padding:36px 22px;text-align:center;background:#111a2b}.emptyicon{font-size:28px}.empty h3{margin:10px 0 5px;font-size:15px}.empty p{color:var(--muted);max-width:450px;margin:0 auto 15px;font-size:12px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px}.table{width:100%;border-collapse:collapse;min-width:720px}.table th{text-align:left;background:#17243a;color:#91a2bd;font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:12px}.table td{border-top:1px solid #25344c;padding:12px;font-size:12px}.table tr:hover td{background:#152238}.status{border-radius:30px;padding:4px 8px;font-size:10px;font-weight:750;background:#243957;color:#c4d6f7;white-space:nowrap}.status.interview,.status.offer{background:#143a31;color:#91e2c6}.status.needs_manual,.status.needs_input{background:#3a301a;color:#f2cc80}.status.rejected{background:#3a2029;color:#ff9ba4}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.formfield label{font-size:11px;color:var(--muted);display:block;margin-bottom:6px}.formfield.full{grid-column:1/-1}.textarea{min-height:130px;resize:vertical}.settingrow{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:14px 0;border-bottom:1px solid #283650}.settingrow:last-child{border:0}.settingrow strong{display:block;font-size:13px}.settingrow p{font-size:11px;color:var(--muted);margin:3px 0 0}.toggle{appearance:none;width:42px;height:24px;border-radius:30px;background:#35435a;position:relative;cursor:pointer;flex:none;transition:.2s}.toggle:checked{background:#6e91fa}.toggle:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.toggle:checked:after{left:21px}.modalback{position:fixed;inset:0;background:#050913c9;z-index:50;display:grid;place-items:center;padding:18px}.modal{width:min(760px,100%);max-height:88vh;overflow:auto;background:#121e32;border:1px solid #405374;border-radius:18px;padding:23px;box-shadow:0 30px 90px #0009}.modalhead{display:flex;justify-content:space-between;gap:12px}.modal h2{margin:0;font-size:20px}.modalbody{color:#b8c6dc;font-size:13px;line-height:1.7}.modalbody h3{color:#fff;font-size:13px;margin:18px 0 4px}.modalbody ul{padding-left:20px}.close{width:32px;height:32px;border:1px solid var(--line);border-radius:9px;background:#1b2a43;color:#fff}.toast{position:fixed;bottom:22px;right:22px;z-index:80;background:#e3edff;color:#14213b;padding:12px 16px;border-radius:11px;font-weight:700;box-shadow:var(--shadow);max-width:min(400px,calc(100vw - 44px));animation:fade .2s}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.mobilebrand{display:none}.footer{padding:24px 0;color:#71809b;font-size:10px;text-align:center}.pillline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.sourcebox{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted)}.source-dot{width:7px;height:7px;border-radius:50%;background:var(--mint)}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}.draftbox{background:#0e192b;border:1px solid #2b3b55;border-radius:12px;padding:14px}.count{font-variant-numeric:tabular-nums}

<body>
<div id="root"></div>
<script>
(function(){
'use strict';
const KEY='jobpilot_personal_v1';
const SKILLS=['Java','Spring Boot','REST APIs','Microservices','Oracle DB','SQL','MySQL','PostgreSQL','MongoDB','Redis','Apache Kafka','Hibernate','JPA','JWT','Multithreading','JUnit','Azure','AWS','Docker','Kubernetes','Jenkins','Git','Maven','Postman','React','Next.js','TypeScript','Observability'];
const DEFAULT_PROFILE={name:'',title:'Java Backend Developer',company:'',experience:'',joined:'',location:'India',targetRoles:'Java Backend Developer, Java Developer, Backend Software Engineer, SDE-1, Spring Boot Developer',preferredLocations:'Pune, Mumbai, Bengaluru, Hyderabad, Remote (India)',skills:SKILLS.join(', '),summary:'',education:'',internship:'',contactEmail:'',contactPhone:'',linkedin:'',notice:'',salary:'',resumeName:'',resumeText:''};
const DEFAULT_SETTINGS={minMatch:80,freshness:14,dailyCap:20,preferredWork:'Any',autoSearch:false,theme:'dark'};
let state=loadState();
let page='dashboard',detailId=null,toastTimer=null,jobStatus={loading:false,errors:[],last:null},outreachDraft='';window.jobPage=1;
function loadState(){try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');return {profile:{...DEFAULT_PROFILE,...(s.profile||{})},settings:{...DEFAULT_SETTINGS,...(s.settings||{})},jobs:Array.isArray(s.jobs)?s.jobs:[],saved:Array.isArray(s.saved)?s.saved:[],ignored:Array.isArray(s.ignored)?s.ignored:[],applications:Array.isArray(s.applications)?s.applications:[],activity:Array.isArray(s.activity)?s.activity:[],drafts:Array.isArray(s.drafts)?s.drafts:[],lastSearch:s.lastSearch||null,remotiveUsage:s.remotiveUsage||{day:'',count:0},lastRemotiveRequestAt:Number(s.lastRemotiveRequestAt||0)}}catch(e){return {profile:{...DEFAULT_PROFILE},settings:{...DEFAULT_SETTINGS},jobs:[],saved:[],ignored:[],applications:[],activity:[],drafts:[],lastSearch:null,remotiveUsage:{day:'',count:0},lastRemotiveRequestAt:0}}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){notify('Browser storage is full. Export a backup and remove older data.','error')}}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safeUrl(v){try{const u=new URL(v);return u.protocol==='https:'?u.href:'#'}catch(e){return '#'}}
function normUrl(v){const s=safeUrl(v);if(s==='#')return '';try{const u=new URL(s);u.hash='';u.search='';return u.href.replace(/\/$/,'')}catch(e){return s}}
function dateFmt(v){if(!v)return 'Date not listed';const d=new Date(v);return isNaN(d)?'Date not listed':d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}
function relative(v){if(!v)return 'Date not listed';const d=new Date(v);if(isNaN(d))return 'Date not listed';const days=Math.max(0,Math.floor((Date.now()-d.getTime())/86400000));return days===0?'Today':days===1?'Yesterday':days+' days ago'}
function addActivity(message){state.activity.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),message,at:new Date().toISOString()});state.activity=state.activity.slice(0,30);persist()}
function notify(message){let el=document.querySelector('.toast');if(el)el.remove();el=document.createElement('div');el.className='toast';el.textContent=message;document.body.appendChild(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),3200)}
function navItems(){return [['dashboard','◫','Overview'],['jobs','⌕','Find jobs'],['saved','☆','Saved jobs'],['applications','▤','Applications'],['profile','◎','Profile & resume'],['outreach','✉','Outreach drafts'],['settings','⚙','Settings']]}
function shell(){const item=navItems().find(x=>x[0]===page)||navItems()[0];return '<div class="shell"><aside class="side"><div class="brand"><div class="brandmark">J</div><div class="brandname">JobPilot<small>Personal career hub</small></div></div><div><div class="navlabel">Workspace</div><nav class="nav">'+navItems().map(x=>'<button data-page="'+x[0]+'" class="'+(page===x[0]?'active':'')+'"><span class="navicon">'+x[1]+'</span><span class="navtext">'+x[2]+'</span></button>').join('')+'</nav></div><div class="sidefoot"><strong>Private by design</strong><p>Your profile, resume and application history stay in this browser. Live job listings are fetched from public job boards.</p></div></aside><section class="workspace"><header class="topbar"><div class="crumb">JobPilot <strong>/ '+item[2]+'</strong></div><div class="topright"><span class="privatepill">● This browser only</span><div class="avatar">P</div></div></header><main class="content">'+pageContent()+'<div class="footer">JOBPILOT · PERSONAL CAREER WORKSPACE · YOUR DATA STAYS IN THIS BROWSER</div></main></section></div>'}
function head(kicker,title,sub,action){return '<div class="pagehead"><div><div class="eyebrow">'+kicker+'</div><h1 class="h1">'+title+'</h1><p class="sub">'+sub+'</p></div>'+(action||'')+'</div>'}
function stat(label,value,note){return '<div class="card stat"><div class="statlabel">'+label+'</div><div class="statvalue count">'+value+'</div><div class="statnote">'+note+'</div></div>'}
function pageContent(){switch(page){case'jobs':return jobsPage(false);case'saved':return jobsPage(true);case'applications':return applicationsPage();case'profile':return profilePage();case'outreach':return outreachPage();case'settings':return settingsPage();default:return dashboardPage()}}
function dashboardPage(){const saved=state.saved.length,apps=state.applications.length,interviews=state.applications.filter(a=>['interview','offer'].includes(a.status)).length,cap=state.settings.dailyCap;return head('YOUR CAREER, IN ONE PLACE',state.profile.name?'Good to see you, '+esc(state.profile.name.split(' ')[0])+'.':'Your career workspace is ready.','A focused workspace for finding your next Java backend opportunity. Your personal information never leaves this browser.','<button class="btn primary" data-action="search-page">⌕ Search live jobs</button>')+'<div class="grid stats">'+stat('Jobs discovered',state.jobs.length,'Live listings cached in this browser')+stat('Saved opportunities',saved,'Jobs you want to revisit')+stat('Applications tracked',apps,'Across your application pipeline')+stat('Interviews & offers',interviews,'Tracked career conversations')+'</div><div class="grid split"><div class="card"><div class="sectionhead"><h2>Recent activity</h2><span class="smallmuted">This browser</span></div>'+(state.activity.length?'<div class="activity">'+state.activity.slice(0,6).map(a=>'<div class="activityrow"><i class="activitydot"></i><div><strong>'+esc(a.message)+'</strong><span>'+dateFmt(a.at)+' · '+new Date(a.at).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})+'</span></div></div>').join('')+'</div>':'<div class="empty"><div class="emptyicon">✦</div><h3>Your next move starts here</h3><p>Search live job boards to discover opportunities. Save roles you like and track every application in one place.</p><button class="btn primary" data-action="search-page">Find your first opportunity</button></div>')+'</div><div class="card"><div class="sectionhead"><h2>Quick actions</h2><span class="smallmuted">Personal workspace</span></div><div class="quick"><button class="btn" data-action="search-page">⌕ <span>Find matching jobs</span></button><button class="btn" data-page="profile">◎ <span>Review my profile & resume</span></button><button class="btn" data-page="applications">▤ <span>Update application tracker</span></button></div><div class="quota"><div class="sectionhead"><strong>Application safety limit</strong><span class="tag warn">Max '+cap+'/day</span></div><div class="progress"><span style="width:0%"></span></div><div class="smallmuted">This is a planning limit only. JobPilot does not submit applications automatically.</div></div></div></div><div class="notice info">JobPilot currently searches when you open it and press Search. It does not run in the background when your browser is closed. Unsupported application portals remain manual.</div>'}
function jobsPage(onlySaved){const data=onlySaved?state.jobs.filter(j=>state.saved.includes(j.id)):state.jobs.filter(j=>!state.ignored.includes(j.id));const count=data.length;return head(onlySaved?'YOUR SHORTLIST':'LIVE OPPORTUNITIES',onlySaved?'Saved jobs':'Find your next role',onlySaved?'Keep promising roles close and decide which ones to pursue.':'Search public job boards for Java, Spring Boot and backend engineering opportunities. Listings link to their original source.','<button class="btn primary" data-action="search-jobs" '+(jobStatus.loading?'disabled':'')+'>'+(jobStatus.loading?'◌ Searching…':'↻ Refresh live jobs')+'</button>')+'<div class="pillline"><div class="sourcebox"><i class="source-dot"></i>Remotive public API</div><div class="sourcebox"><i class="source-dot" style="background:#84a4ff"></i>Arbeitnow public API</div><span class="smallmuted">· Personal use · Real listings only</span></div><div class="toolbar"><input id="job-query" class="field" placeholder="Search title, company or skill…" value="'+esc(window.jobQuery||'')+'"><select id="job-location" class="select"><option value="">All locations</option><option>India</option><option>Remote</option><option>Pune</option><option>Mumbai</option><option>Bengaluru</option><option>Hyderabad</option><option>Europe</option></select><select id="job-sort" class="select"><option value="match">Best match</option><option value="date">Newest first</option></select><select id="job-work" class="select"><option value="Any" '+(state.settings.preferredWork==='Any'?'selected':'')+'>Any work type</option><option value="Remote" '+(state.settings.preferredWork==='Remote'?'selected':'')+'>Remote</option><option value="Hybrid" '+(state.settings.preferredWork==='Hybrid'?'selected':'')+'>Hybrid</option><option value="On-site" '+(state.settings.preferredWork==='On-site'?'selected':'')+'>On-site</option></select><select id="job-min" class="select"><option value="'+state.settings.minMatch+'" selected>'+state.settings.minMatch+'%+ target</option><option value="0">All scores</option><option value="60">60%+ match</option></select></div><div id="job-errors">'+(jobStatus.errors.length?'<div class="notice">'+jobStatus.errors.map(esc).join(' · ')+'</div>':'')+'</div><div class="sectionhead"><h2>'+count+' '+(count===1?'opportunity':'opportunities')+' in your workspace</h2><span class="smallmuted">'+(state.lastSearch?'Last checked '+relative(state.lastSearch):'Search to load live listings')+'</span></div><div id="job-results">'+jobResultsMarkup(data,onlySaved)+'</div><div class="smallmuted" style="margin-top:13px">Remotive listings may be delayed by 24 hours. Always verify role availability and requirements on the original employer/job-board page.</div>'}

function calcMatch(j){const text=(j.title+' '+j.description+' '+j.tags.join(' ')).toLowerCase(),skills=state.profile.skills.split(',').map(s=>s.trim()).filter(Boolean),hits=skills.filter(s=>{const v=s.toLowerCase();return text.includes(v)||(v==='rest apis'&&text.includes('restful'))||(v==='apache kafka'&&text.includes('kafka'))||(v==='oracle db'&&text.includes('oracle'))});const role=/java|spring|backend|back-end|software engineer|software developer|sde|platform engineer|full stack/i.test(j.title)?34:/developer|engineer|programmer/i.test(j.title)?20:0;const skillScore=Math.min(50,hits.length*10);const years=/[3-5]\+?\s*years?|[3-5]\s*-\s*[6-8]\s*years?/i.test(text)?(parseInt((text.match(/[3-5]/)||['3'])[0],10)<=2?10:3):10;const loc=(j.location+' '+j.workplace).toLowerCase(),prefs=state.profile.preferredLocations.toLowerCase().split(',').map(x=>x.trim()),locationScore=(/remote|india/i.test(loc)||prefs.some(x=>x&&loc.includes(x)))?6:2;const score=Math.max(0,Math.min(100,role+skillScore+years+locationScore));return {score,hits,missing:skills.filter(s=>!hits.includes(s)).slice(0,10),band:score>=80?'Strong':score>=60?'Possible':'Stretch',why:[role?'Relevant engineering title':'Title relevance is limited',hits.length+' known skills found in the listing',years===10?'No explicit experience conflict detected':'Experience requirement needs review',locationScore===6?'Location appears aligned':'Location should be confirmed']}}
function normalizeRemotive(j){return{id:'remotive:'+j.id,source:'Remotive',sourceId:String(j.id),title:j.title||'Untitled role',company:j.company_name||'Company not listed',location:j.candidate_required_location||'Remote',workplace:'Remote',description:j.description||'',tags:Array.isArray(j.tags)?j.tags:[],date:j.publication_date||null,url:j.url||'',score:0,scoreBand:'',salary:j.salary||'',jobType:j.job_type||''}}
function normalizeArbeit(j){return{id:'arbeitnow:'+j.slug,source:'Arbeitnow',sourceId:String(j.slug||j.url),title:j.title||'Untitled role',company:j.company_name||'Company not listed',location:j.location||'Location not listed',workplace:j.remote?'Remote':(j.location||'On-site'),description:j.description||'',tags:Array.isArray(j.tags)?j.tags:[],date:j.created_at||null,url:j.url||'',score:0,scoreBand:'',salary:'',jobType:j.job_types||''}}
async function apiJson(url,timeout=15000){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeout);try{const response=await fetch(url,{headers:{Accept:'application/json'},signal:controller.signal,credentials:'omit',referrerPolicy:'no-referrer',cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);return await response.json()}catch(e){if(e.name==='AbortError')throw new Error('Request timed out after '+Math.round(timeout/1000)+' seconds');throw e}finally{clearTimeout(timer)}}
async function searchJobs(){if(jobStatus.loading)return;jobStatus.loading=true;jobStatus.errors=[];render();const day=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());if(state.remotiveUsage.day!==day)state.remotiveUsage={day,count:0};if(Date.now()-state.lastRemotiveRequestAt<30000&&state.lastRemotiveRequestAt){jobStatus.loading=false;jobStatus.errors.push('Please wait 30 seconds between Remotive refreshes to respect source rate limits.');render();return}if(state.remotiveUsage.count>=4){jobStatus.loading=false;jobStatus.errors.push('Remotive refresh limit reached for today (4 requests). Try again tomorrow; your cached listings remain available.');render();return}try{state.lastRemotiveRequestAt=Date.now();persist();const requests=[apiJson('https://remotive.com/api/remote-jobs?category=software-dev&limit=100'),apiJson('https://www.arbeitnow.com/api/job-board-api?page=1')];const results=await Promise.allSettled(requests);state.remotiveUsage.count++;let fresh=[];if(results[0].status==='fulfilled'){const jobs=results[0].value.jobs||[];fresh=fresh.concat(jobs.map(normalizeRemotive))}else jobStatus.errors.push('Remotive: '+results[0].reason.message);if(results[1].status==='fulfilled'){const jobs=results[1].value.data||[];fresh=fresh.concat(jobs.map(normalizeArbeit))}else jobStatus.errors.push('Arbeitnow: '+results[1].reason.message);const valid=fresh.filter(j=>safeUrl(j.url)!=='#'&&j.title&&j.description);const seen=new Set();const freshJobs=valid.filter(j=>{const u=normUrl(j.url);if(!u||seen.has(u))return false;seen.add(u);return true}).map(j=>{const m=calcMatch(j);j.score=m.score;j.scoreBand=m.band;return j});const freshUrls=new Set(freshJobs.map(j=>normUrl(j.url)));const retainedSaved=state.jobs.filter(j=>state.saved.includes(j.id)&&!freshUrls.has(normUrl(j.url)));state.jobs=freshJobs.concat(retainedSaved);state.lastSearch=new Date().toISOString();addActivity('Searched public job boards: '+state.jobs.length+' unique listings loaded');if(results.every(r=>r.status==='rejected'))jobStatus.errors.push('No source responded. Check your connection and retry; no sample jobs were added.');else if(!state.jobs.length)jobStatus.errors.push('Sources responded, but no valid listings were returned.');}catch(e){jobStatus.errors.push(e.message||'Unable to search jobs')}finally{jobStatus.loading=false;persist();render()}}
function applicationFor(job){if(state.applications.some(a=>normUrl(a.url)===normUrl(job.url))){notify('This job is already in your application tracker.');return}state.applications.unshift({id:'app:'+Date.now()+Math.random().toString(16).slice(2),jobId:job.id,title:job.title,company:job.company,url:job.url,status:'needs_manual',createdAt:new Date().toISOString(),followupAt:'',notes:'',score:job.score});persist();addActivity('Added '+job.title+' at '+job.company+' to application tracker');notify('Added to tracker. Portal submission remains manual.')}
function toggleSave(id){state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):state.saved.concat(id);persist();render();notify(state.saved.includes(id)?'Job saved.':'Removed from saved jobs.')}
function detailsMarkup(j){const m=calcMatch(j);return '<div class="modalback" data-action="close-modal"><div class="modal" data-modal="true"><div class="modalhead"><div><div class="eyebrow">'+esc(j.source)+' · '+esc(relative(j.date))+'</div><h2>'+esc(j.title)+'</h2><div class="company">'+esc(j.company)+' · '+esc(j.location)+'</div></div><button class="close" data-action="close-modal">×</button></div><div class="jobmeta"><span class="tag good">'+j.score+'% heuristic match</span><span class="tag">'+esc(j.workplace)+'</span><span class="tag">'+esc(dateFmt(j.date))+'</span></div><div class="modalbody"><h3>Why this match</h3><ul>'+m.why.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><h3>Skills found in the listing</h3><p>'+esc(m.hits.join(', ')||'No matching profile skills found in the available description.')+'</p><h3>Skills not found in the listing</h3><p>'+esc(m.missing.join(', ')||'No missing profile skills detected.')+'</p><h3>Job description</h3><p>'+esc(stripHtml(j.description)).slice(0,11000)+'</p><p class="smallmuted">This is a keyword-based estimate, not an employer or ATS decision. Review eligibility, seniority, location and all mandatory requirements yourself.</p></div><div class="jobactions"><button class="btn primary" data-action="track" data-id="'+esc(j.id)+'">Add to application tracker</button><button class="btn" data-action="save" data-id="'+esc(j.id)+'">'+(state.saved.includes(j.id)?'★ Saved':'☆ Save job')+'</button><a class="btn ghost" href="'+safeUrl(j.url)+'" target="_blank" rel="noopener noreferrer">Open original listing ↗</a></div></div></div>'}
function saveProfile(){const ids=['name','title','company','experience','location','joined','roles','locations','skills','summary','education','internship','email','phone','linkedin','notice','salary'];ids.forEach(id=>{const el=document.getElementById('p-'+id);if(el){const key={roles:'targetRoles',locations:'preferredLocations',email:'contactEmail',phone:'contactPhone',linkedin:'linkedin',notice:'notice',salary:'salary'}[id]||id;state.profile[key]=el.value.trim()}});persist();addActivity('Updated candidate profile and matching evidence');notify('Profile saved in this browser.');render()}
function saveSettings(){const n=(id,def)=>Number(document.getElementById(id)?.value??def);state.settings.minMatch=Math.min(100,Math.max(0,n('s-match',80)));state.settings.freshness=Math.min(60,Math.max(1,n('s-fresh',14)));state.settings.dailyCap=Math.min(20,Math.max(0,n('s-cap',20)));state.settings.preferredWork=document.getElementById('s-work')?.value||'Any';persist();state.jobs=state.jobs.map(j=>{const m=calcMatch(j);return{...j,score:m.score,scoreBand:m.band}});notify('Preferences saved.');render()}
function makeDraft(){const app=state.applications.find(a=>a.id===document.getElementById('outreach-app')?.value),name=document.getElementById('outreach-name')?.value.trim(),email=document.getElementById('outreach-email')?.value.trim(),source=document.getElementById('outreach-source')?.value.trim();const role=app?app.title:'the backend engineering opportunity';const company=app?app.company:'your team';const subject='Interest in '+role+' at '+company;const body='Hello '+(name||'Hiring Team')+',\n\nI am reaching out to express my interest in the '+role+' opportunity at '+company+'. My background includes Java, Spring Boot, REST APIs and backend microservices.\n\nMy experience includes enterprise onboarding and disaster-recovery workflows, database-backed services, production troubleshooting and API testing. I would appreciate the opportunity to discuss how my background may align with your team’s needs.\n\nThank you for your time.\n\nRegards,\n'+(state.profile.name||'Your Name');const d={id:'draft:'+Date.now(),recipient:name||'Hiring Team',email,source,subject,body,createdAt:new Date().toISOString(),appId:app?.id||''};state.drafts.unshift(d);persist();outreachDraft=d.id;addActivity('Created an outreach draft for '+company);render();document.getElementById('draft-preview').innerHTML='<div class="card"><div class="sectionhead"><h2>'+esc(subject)+'</h2><button class="btn small" data-action="copy-draft" data-id="'+esc(d.id)+'">Copy draft</button></div><div class="draftbox"><p class="smallmuted">To: '+esc(email||'Not specified — verify contact first')+'</p><pre style="white-space:pre-wrap;font:inherit;color:#c9d5e8">'+esc(body)+'</pre></div></div>'}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jobpilot-personal-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);notify('Backup downloaded. Keep it somewhere private.')}
function importData(file){const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!s||typeof s.profile!=='object'||typeof s.settings!=='object'||!Array.isArray(s.jobs)||!Array.isArray(s.saved)||!Array.isArray(s.applications)||!Array.isArray(s.drafts))throw new Error('Backup structure not recognized');state={...loadState(),...s,profile:{...DEFAULT_PROFILE,...s.profile},settings:{...DEFAULT_SETTINGS,...s.settings},jobs:s.jobs,saved:s.saved,ignored:Array.isArray(s.ignored)?s.ignored:[],applications:s.applications,activity:Array.isArray(s.activity)?s.activity:[],drafts:s.drafts};persist();render();notify('Backup restored in this browser.')}catch(e){notify('Could not import this backup.','error')}};r.readAsText(file)}
function clearAll(){if(!confirm('Delete all JobPilot profile, saved jobs, applications, drafts and settings from this browser? This cannot be undone unless you exported a backup.'))return;localStorage.removeItem(KEY);state=loadState();page='dashboard';addActivity('Started a fresh local workspace');render();notify('JobPilot data deleted from this browser.')}
async function readResume(file){const stateEl=document.getElementById('resume-state');if(!file)return;if(file.size>10*1024*1024){stateEl.textContent='File is larger than the 10 MB limit.';notify('Please choose a resume smaller than 10 MB.');return}stateEl.textContent='Extracting resume text locally…';try{let text='';if(file.name.toLowerCase().endsWith('.pdf')){if(!window.pdfjsLib)throw new Error('PDF reader could not load. You can still use the profile editor.');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;if(pdf.numPages>30)throw new Error('Please use a resume with 30 pages or fewer.');for(let i=1;i<=pdf.numPages;i++){const p=await pdf.getPage(i),c=await p.getTextContent();text+=c.items.map(x=>x.str).join(' ')+'\n'}}else if(file.name.toLowerCase().endsWith('.docx')){if(!window.mammoth)throw new Error('DOCX reader could not load.');const r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});text=r.value}else throw new Error('Please choose a PDF or DOCX file.');state.profile.resumeName=file.name;state.profile.resumeText=text.slice(0,100000);const found=SKILLS.filter(s=>text.toLowerCase().includes(s.toLowerCase()));const current=new Set(state.profile.skills.split(',').map(x=>x.trim().toLowerCase()));found.forEach(s=>{if(!current.has(s.toLowerCase()))state.profile.skills+=', '+s});persist();stateEl.textContent='Extracted '+text.length.toLocaleString('en-IN')+' characters locally. Skills detected: '+(found.join(', ')||'Review the text manually')+'.';notify('Resume processed in your browser. Review detected skills before relying on them.')}catch(e){stateEl.textContent=e.message;notify(e.message)}}
function closeModal(){detailId=null;const el=document.querySelector('.modalback');if(el)el.remove()}
function render(){document.getElementById('root').innerHTML=shell();if(detailId){const j=state.jobs.find(x=>x.id===detailId);if(j)document.body.insertAdjacentHTML('beforeend',detailsMarkup(j))}}
document.addEventListener('click',async e=>{const nav=e.target.closest('[data-page]');if(nav){page=nav.dataset.page;detailId=null;window.jobQuery='';render();return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='search-page'){page='jobs';render();searchJobs();return}if(a==='search-jobs'){searchJobs();return}if(a==='next-jobs'||a==='prev-jobs'){window.jobPage=Math.max(1,(window.jobPage||1)+(a==='next-jobs'?1:-1));const el=document.getElementById('job-results');if(el)el.innerHTML=jobResultsMarkup(page==='saved'?state.jobs.filter(j=>state.saved.includes(j.id)):state.jobs.filter(j=>!state.ignored.includes(j.id)),page==='saved');return}if(a==='details'){detailId=id;render();return}if(a==='close-modal'){if(e.target.closest('[data-modal]'))return;closeModal();return}if(a==='save'){toggleSave(id);return}if(a==='track'){const j=state.jobs.find(x=>x.id===id);if(j)applicationFor(j);if(detailId)closeModal();if(page==='jobs'||page==='saved')render();return}if(a==='edit-app'){const app=state.applications.find(x=>x.id===id);if(app){const note=prompt('Application notes for '+app.title,app.notes||'');if(note===null)return;const follow=prompt('Follow-up date (YYYY-MM-DD), or blank for none',app.followupAt||'');if(follow===null)return;if(follow&&!/^\\d{4}-\\d{2}-\\d{2}$/.test(follow)){notify('Use date format YYYY-MM-DD.');return}app.notes=note;app.followupAt=follow;persist();addActivity('Updated notes or follow-up date for '+app.title);render();notify('Application updated.')}return}if(a==='remove-app'){state.applications=state.applications.filter(x=>x.id!==id);persist();addActivity('Removed an application from the tracker');render();notify('Application removed.');return}if(a==='save-profile'){saveProfile();return}if(a==='save-settings'){saveSettings();return}if(a==='make-draft'){makeDraft();return}if(a==='copy-draft'){const d=state.drafts.find(x=>x.id===id);if(d){try{await navigator.clipboard.writeText('Subject: '+d.subject+'\n\n'+d.body);notify('Draft copied to clipboard.')}catch(e){notify('Clipboard access unavailable. Open the saved draft to copy manually.')}}return}if(a==='delete-draft'){state.drafts=state.drafts.filter(x=>x.id!==id);persist();render();notify('Draft deleted.');return}if(a==='clear-resume'){state.profile.resumeName='';state.profile.resumeText='';persist();render();notify('Resume text removed.');return}if(a==='export'){exportData();return}if(a==='reset-data'){clearAll();return}});
document.addEventListener('input',e=>{if(e.target.id==='job-query'){window.jobQuery=e.target.value;window.jobPage=1;const el=document.getElementById('job-results');if(el)el.innerHTML=jobResultsMarkup(page==='saved'?state.jobs.filter(j=>state.saved.includes(j.id)):state.jobs.filter(j=>!state.ignored.includes(j.id)),page==='saved')}});
document.addEventListener('change',e=>{if(e.target.id==='job-location'||e.target.id==='job-min'||e.target.id==='job-sort'||e.target.id==='job-work'){window.jobPage=1;const el=document.getElementById('job-results');if(el)el.innerHTML=jobResultsMarkup(page==='saved'?state.jobs.filter(j=>state.saved.includes(j.id)):state.jobs.filter(j=>!state.ignored.includes(j.id)),page==='saved')}if(e.target.dataset.status){const a=state.applications.find(x=>x.id===e.target.dataset.status);if(a){a.status=e.target.value;persist();addActivity('Updated '+a.title+' status to '+a.status.replace('_',' '));notify('Application status updated.')}}if(e.target.id==='resume-file')readResume(e.target.files[0]);if(e.target.id==='import-file')importData(e.target.files[0])});
render();
if(!state.activity.length){addActivity('Personal workspace initialized');}
})();
</script>
</body>
